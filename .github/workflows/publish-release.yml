name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists"
            exit 0
          fi

          cat > release-notes.md <<'EOF'
          First public release of the Tekken 6 PPSSPP aspect-ratio + camera CWCheat for the USA build (`ULUS10466`).

          ## Download

          Download **`ULUS10466.ini`** from the Assets section below and place it in your PPSSPP `PSP/Cheats/` folder.

          ## Included

          - Aspect ratios: 21:9, 20:9, 19.5:9, 19:9, 18.5:9, 18:9 (2:1), 16:9, 16:10, and 4:3
          - Camera presets: Original, Slightly Wider, Wider, and Widest
          - Restore option for returning aspect ratio and camera values to their defaults

          This release targets **Tekken 6 USA (`ULUS10466`)**.
          EOF

          gh release create v1.0.0 ULUS10466.ini \
            --target "$GITHUB_SHA" \
            --title "Tekken 6 Aspect Ratio + Camera CWCheat v1.0.0" \
            --notes-file release-notes.md
