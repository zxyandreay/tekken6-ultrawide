name: Build PPSSPP plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'plugin/**'
      - 'tools/trace_hud_candidates.py'
      - 'tools/trace_v05_candidates.py'
      - 'docs/PLUGIN_TEST.md'
      - 'docs/STATUS.md'
      - 'README.md'
      - 'RELEASE_v0.5.md'
      - '.github/workflows/build-plugin.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt

      - name: Trace HUD and camera candidates
        run: |
          python tools/trace_hud_candidates.py \
            --eboot ULUS10466_EBOOT.BIN \
            --output diagnostics-ci/HUD_TRACE.md
          python tools/trace_v05_candidates.py \
            --eboot ULUS10466_EBOOT.BIN \
            --output diagnostics-ci/V05_TRACE.md

      - name: Upload analysis trace
        uses: actions/upload-artifact@v4
        with:
          name: Tekken6-HUD-camera-trace
          path: diagnostics-ci/*.md
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PRX
        id: build
        shell: sh
        run: |
          set +e
          make -C plugin clean all > plugin/build.log 2>&1
          status=$?
          cat plugin/build.log
          exit $status

      - name: Package PPSSPP plugin
        if: success()
        shell: sh
        run: |
          set -eu
          DEST="dist/PSP/PLUGINS/Tekken6.PPSSPP.UltrawideFix"
          mkdir -p "$DEST"
          cp plugin/Tekken6.PPSSPP.UltrawideFix.prx "$DEST/"
          cp plugin/package/plugin.ini "$DEST/"
          cp plugin/package/Tekken6.PPSSPP.UltrawideFix.ini "$DEST/"
          cp docs/PLUGIN_TEST.md dist/TESTING.md
          cp README.md dist/README.md
          cp RELEASE_v0.5.md dist/RELEASE_NOTES.md
          find dist -maxdepth 5 -type f -print

      - name: Upload plugin package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tekken6-PPSSPP-UltrawideFix
          path: dist/
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tekken6-PPSSPP-UltrawideFix-build-log
          path: plugin/build.log
          if-no-files-found: warn

  release:
    if: "github.event_name == 'push' && github.event.head_commit.message == 'release: v0.5'"
    needs:
      - analyze
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packaged plugin
        uses: actions/download-artifact@v4
        with:
          name: Tekken6-PPSSPP-UltrawideFix
          path: release-dist

      - name: Create release ZIP
        run: |
          set -eu
          cd release-dist
          zip -r ../Tekken6-PPSSPP-UltrawideFix-v0.5.zip .

      - name: Publish v0.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create v0.5 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Tekken 6 PPSSPP Ultrawide Fix v0.5" \
            --notes-file RELEASE_v0.5.md \
            --latest \
            Tekken6-PPSSPP-UltrawideFix-v0.5.zip
