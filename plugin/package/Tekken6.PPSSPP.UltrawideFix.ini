[MAIN]
; For the user's POCO F5 test. Change to auto after the fixed 20:9 path is validated.
ForceAspectRatio = 20:9

; Verified 3D aspect patch. Disable the old CWCheat while testing the plugin.
Enable3D = 1

; Experimental HUD path selector:
; 0 = off (safe default / verified 3D only)
; 1 = candidate group A (recommended first HUD test)
; 2 = candidate group B / mask-like path
; 3 = both groups
HUDMode = 0

; 600 is the centered 16:9 logical width required for exact 20:9 compensation:
; 480 * (20/16) = 600. Keep this at 600 for the POCO F5 HUD tests.
HUDVirtualWidth = 600

DebugLogging = 1
