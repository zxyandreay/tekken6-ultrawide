[MAIN]
; Tekken 6 PPSSPP Ultrawide Fix v0.5 beta
; Primary development target: 20:9 ultrawide.
ForceAspectRatio = 20:9

; Validated v0.3/v0.4 3D runtime foundation.
Enable3D = 1

; Gameplay camera.
; 0 = Original (0x3F80)
; 1 = Slightly Wider (0x3F81)
; 2 = Wider (0x3F82) [default]
; 3 = Widest (0x3F83)
EnableCamera = 1
CameraPreset = 2

; v0.5 beta: targeted logical-canvas experiment at three traced UI callsites.
; At 20:9 the hooked descriptors use a 600x272 logical canvas instead of 480x272.
; Set this to 0 immediately if a HUD/menu screen regresses.
EnableHUDExperimental = 1

; Maintenance poll interval. Healthy JIT blocks are no longer invalidated/re-written every poll.
PatchIntervalMs = 77

; Set to 1 only when collecting a diagnostic log.
DebugLogging = 0
