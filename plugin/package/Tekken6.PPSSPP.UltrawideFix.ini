[MAIN]
; Tekken 6 PPSSPP Ultrawide Fix v0.6 beta
; Primary development target: POCO F5 / 20:9 with PPSSPP Display Layout = Stretch.
ForceAspectRatio = 20:9

; Validated 3D ultrawide foundation.
Enable3D = 1

; Gameplay camera.
; 0 = Original (0x3F80)
; 1 = Slightly Wider (0x3F81)
; 2 = Wider (0x3F82) [default]
; 3 = Widest (0x3F83)
EnableCamera = 1
CameraPreset = 2

; v0.6 native PSP 2D presentation layer.
; Keeps authored HUD/UI/menu coordinates unchanged, but maps the complete flat
; viewport into a centered 480:272-proportion safe area before PPSSPP Stretch.
EnableNative2DSafeArea = 1

; Low-churn runtime maintenance poll.
PatchIntervalMs = 77

; Set to 1 only when collecting a diagnostic log.
DebugLogging = 0
