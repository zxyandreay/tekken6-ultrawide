[MAIN]
; v0.3 CWCheat-order runtime diagnostic.
; Exact target for the POCO F5.
ForceAspectRatio = 20:9

; Reproduce the known-good ULUS10466 3D CWCheat from a PRX.
Enable3D = 1

; Match PPSSPP's default CWCheat refresh interval closely. v0.3 invalidates
; each code range BEFORE writing, then reapplies continuously like CWCheat.
PatchIntervalMs = 77

DebugLogging = 1

; HUD correction remains disabled until this build proves that PRX-side code
; patching can reproduce the known-good 3D CWCheat visually.
