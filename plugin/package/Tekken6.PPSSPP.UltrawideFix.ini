[MAIN]
; Tekken 6 PPSSPP Ultrawide Fix v0.4
; Primary development target: 20:9 ultrawide.
ForceAspectRatio = 20:9

; Validated v0.3 3D runtime foundation.
Enable3D = 1

; v0.4 camera integration.
; 0 = Original (0x3F80)
; 1 = Slightly Wider (0x3F81)
; 2 = Wider (0x3F82) [default]
; 3 = Widest (0x3F83)
EnableCamera = 1
CameraPreset = 2

; Reapply using PPSSPP CWCheat-style invalidate-before-write behavior.
PatchIntervalMs = 77

; Set to 1 when collecting a diagnostic log.
DebugLogging = 0

; HUD/UI/menu correction is still under research and is not enabled in v0.4.
