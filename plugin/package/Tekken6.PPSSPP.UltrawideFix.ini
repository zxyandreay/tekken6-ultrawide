[MAIN]
; v0.2 runtime diagnostic package.
; First isolate plugin loading and verified 3D code patching.
; Exact target for the POCO F5.
ForceAspectRatio = 20:9

; Reproduces the known-good ULUS10466 3D CWCheat through a runtime PRX patch.
Enable3D = 1

; Keep logging enabled for this diagnostic build.
DebugLogging = 1

; HUD correction is intentionally NOT enabled in v0.2.
; The previous HUD candidate modes were not proven live HUD paths and must not
; be mixed into the 3D loader/patch diagnosis. HUD research resumes only after
; the log and visual test prove the PRX reproduces the known-good 3D patch.
